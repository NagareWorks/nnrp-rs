[package]
name = "nnrp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Transport-neutral NNRP client/server session runtime over framed async transport slots."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nnrp-runtime"
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["native-tcp"]
native-tcp = []

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
futures-timer.workspace = true
getrandom.workspace = true
http.workspace = true
nnrp-core = { path = "../nnrp-core", version = "1.0.0-preview.4.21" }
nnrp-transport-provider = { path = "../nnrp-transport-provider", version = "1.0.0-preview.4.21" }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
