name: Release

env:
  NNRP_CONFORMANCE_SOURCE_COMMIT: 0167a48d0af7520358575c6bcf9833c053efc403
  NNRP_DOC_SOURCE_COMMIT: 3439ded0d318bd736f6485b17f2563fae77627bf

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release when running manually
        required: true
        default: main
      create_tag:
        description: Create and push the resolved release tag before publishing
        required: true
        type: boolean
        default: false
      publish_github_release:
        description: Publish or update the GitHub Release
        required: true
        type: boolean
        default: false
      publish_to_crates:
        description: Publish crates to crates.io
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve version
        id: version
        run: python scripts/resolve_version.py show --github-output --run-number ""

      - name: Resolve immutable source commit
        id: source
        run: python scripts/release_identity.py resolve --github-output

      - name: Validate release source identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          python scripts/release_identity.py verify-tag \
            --tag "${{ steps.version.outputs.tag_name }}" \
            --source-commit "${{ steps.source.outputs.source_commit }}" \
            --allow-missing
          python scripts/release_identity.py verify-registry \
            --version "${{ steps.version.outputs.package_version }}" \
            --tag "${{ steps.version.outputs.tag_name }}" \
            --source-commit "${{ steps.source.outputs.source_commit }}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "${{ steps.version.outputs.tag_name }}" ]; then
            echo "Release tag mismatch: expected ${{ steps.version.outputs.tag_name }} but workflow was triggered by ${{ github.ref_name }}."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.publish_github_release }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
              echo "Manual GitHub Release publishing requires create_tag=true."
              exit 1
            fi
            if [ "${{ inputs.publish_to_crates }}" = "true" ] && [ "${{ inputs.create_tag }}" != "true" ]; then
              echo "Manual crates.io publishing requires create_tag=true."
              exit 1
            fi
          fi

  native-artifacts:
    name: Native artifact (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      NNRP_RELEASE_VERSION: ${{ needs.prepare.outputs.package_version }}
      NNRP_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86
            runner: ubuntu-latest
            target: i686-unknown-linux-gnu
            apt: gcc-multilib
            rustflags: -C link-arg=-m32
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
          - name: linux-armv7
            runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            apt: gcc-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker: arm-linux-gnueabihf-gcc
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-x86
            runner: windows-latest
            target: i686-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: ios-aarch64
            runner: macos-latest
            target: aarch64-apple-ios
          - name: ios-aarch64-sim
            runner: macos-latest
            target: aarch64-apple-ios-sim
          - name: ios-x86_64-sim
            runner: macos-latest
            target: x86_64-apple-ios
          - name: android-aarch64
            runner: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - name: android-armv7
            runner: ubuntu-latest
            target: armv7-linux-androideabi
            android: true
          - name: android-x86
            runner: ubuntu-latest
            target: i686-linux-android
            android: true
          - name: android-x86_64
            runner: ubuntu-latest
            target: x86_64-linux-android
            android: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install Linux cross linker
        if: runner.os == 'Linux' && matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Setup Android NDK
        if: matrix.android
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure cross linker
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ matrix.linker_env }}" ]; then
            echo "${{ matrix.linker_env }}=${{ matrix.linker }}" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ matrix.rustflags }}" ]; then
            echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
          fi

          if [ "${{ matrix.android }}" = "true" ]; then
            toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            case "${{ matrix.target }}" in
              aarch64-linux-android)
                compiler="$toolchain/aarch64-linux-android21-clang"
                cargo_linker="CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
                cc_env="CC_aarch64_linux_android"
                ar_env="AR_aarch64_linux_android"
                ;;
              armv7-linux-androideabi)
                compiler="$toolchain/armv7a-linux-androideabi21-clang"
                cargo_linker="CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
                cc_env="CC_armv7_linux_androideabi"
                ar_env="AR_armv7_linux_androideabi"
                ;;
              i686-linux-android)
                compiler="$toolchain/i686-linux-android21-clang"
                cargo_linker="CARGO_TARGET_I686_LINUX_ANDROID_LINKER"
                cc_env="CC_i686_linux_android"
                ar_env="AR_i686_linux_android"
                ;;
              x86_64-linux-android)
                compiler="$toolchain/x86_64-linux-android21-clang"
                cargo_linker="CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
                cc_env="CC_x86_64_linux_android"
                ar_env="AR_x86_64_linux_android"
                ;;
              *)
                echo "Unsupported Android target: ${{ matrix.target }}"
                exit 1
                ;;
            esac

            echo "$cargo_linker=$compiler" >> "$GITHUB_ENV"
            echo "$cc_env=$compiler" >> "$GITHUB_ENV"
            echo "$ar_env=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          fi

      - name: Package native link library
        run: >
          python scripts/package_native_artifacts.py
          --target ${{ matrix.target }}
          --package-name ${{ matrix.name }}
          --out artifacts/native
          --transport-scope tcp
          --transport-scope quic
          --transport-scope ipc
          --transport-scope websocket

      - name: Inspect native artifact boundaries
        run: >-
          python scripts/inspect_release_artifacts.py
          --native-dir artifacts/native
          --sdk-version "${{ needs.prepare.outputs.package_version }}"
          --source-commit "${{ needs.prepare.outputs.source_commit }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-ffi-native-${{ matrix.name }}
          path: artifacts/native/*
          if-no-files-found: error

  package:
    needs: [prepare, native-artifacts]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NNRP_RELEASE_VERSION: ${{ needs.prepare.outputs.package_version }}
      NNRP_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Checkout nnrp-conformance action
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-conformance
          ref: ${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}
          path: nnrp-conformance-action
          fetch-depth: 1

      - name: Checkout frozen SDK API contract
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/nnrp-doc
          ref: ${{ env.NNRP_DOC_SOURCE_COMMIT }}
          path: nnrp-doc-contract
          fetch-depth: 1

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags
          tag="${{ needs.prepare.outputs.tag_name }}"
          source_commit="${{ needs.prepare.outputs.source_commit }}"
          if [ -z "$(git tag --list "$tag")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$source_commit"
            git push origin "$tag"
          fi
          git fetch --force --tags
          python scripts/release_identity.py verify-tag \
            --tag "$tag" \
            --source-commit "$source_commit"

      - name: Apply build version
        run: |
          python scripts/resolve_version.py apply --package-version "${{ needs.prepare.outputs.package_version }}"

      - name: Format check
        run: cargo fmt --all --check

      - name: SDK API contract parity
        run: >-
          python scripts/check_sdk_api_contract.py
          --contract nnrp-doc-contract/docs/public/contracts/nnrp-1-preview4-sdk-api.json

      - name: Test
        env:
          NNRP_CONFORMANCE_SUITE_REPO: ${{ github.workspace }}/nnrp-conformance-action
        run: cargo test --workspace

      - name: Run preview4 suite-owned conformance action
        uses: ./nnrp-conformance-action/.github/actions/run-conformance
        with:
          protocol-version: nnrp-1-preview4
          capabilities-path: conformance/nnrp-1-preview4.capabilities.json
          require-complete-capability-coverage: "true"
          working-directory: .
          artifact-name: nnrp-rs-preview4-conformance
          adapter-command: >-
            cargo run -p nnrp-conformance --bin nnrp-conformance-adapter --
            --plan $env:NNRP_CONFORMANCE_ADAPTER_PLAN
            --output $env:NNRP_CONFORMANCE_ADAPTER_RESULTS

      - name: Run preview4 host-route wire conformance
        run: >-
          python scripts/run_preview4_host_route_conformance.py
          --suite-root nnrp-conformance-action
          --output-root target/wire-conformance/preview4-host-route

      - name: Download native link libraries
        uses: actions/download-artifact@v7
        with:
          pattern: nnrp-ffi-native-*
          path: artifacts/native
          merge-multiple: true

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Package WASM primitives
        run: |
          rustup target add wasm32-unknown-unknown
          python scripts/package_wasm_primitives.py --out artifacts/wasm --transport-scope browser

      - name: Inspect release artifact boundaries
        run: |
          python scripts/inspect_release_artifacts.py \
            --native-dir artifacts/native \
            --wasm-dir artifacts/wasm \
            --sdk-version "${{ needs.prepare.outputs.package_version }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}"

      - name: Bundle release artifacts
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil
          import zipfile

          version = '${{ needs.prepare.outputs.package_version }}'
          dist_dir = pathlib.Path('artifacts')
          dist_dir.mkdir(exist_ok=True)
          release_dir = dist_dir / 'release-assets'
          if release_dir.exists():
            shutil.rmtree(release_dir)
          release_dir.mkdir(exist_ok=True)

          source_artifact = release_dir / f'nnrp-rs-source-{version}.zip'
          with zipfile.ZipFile(source_artifact, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
            include_paths = [
              pathlib.Path('Cargo.toml'),
              pathlib.Path('Cargo.lock'),
              pathlib.Path('README.md'),
              pathlib.Path('LICENSE'),
            ]
            for path in include_paths:
              if path.exists():
                archive.write(path, path.as_posix())

            for root in ('crates', 'doc'):
              base = pathlib.Path(root)
              if not base.exists():
                continue
              for item in sorted(base.rglob('*')):
                if item.is_file():
                  archive.write(item, item.as_posix())

            for root in ('include', 'artifacts/native', 'artifacts/wasm'):
              base = pathlib.Path(root)
              if not base.exists():
                continue
              for item in sorted(base.rglob('*')):
                if item.is_file():
                  archive.write(item, item.as_posix())

          def zip_dir(source: pathlib.Path, artifact: pathlib.Path) -> None:
            with zipfile.ZipFile(artifact, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(source.rglob('*')):
                if item.is_file():
                  archive.write(item, item.relative_to(source).as_posix())

          for package_dir in sorted((dist_dir / 'native').glob('*')):
            if package_dir.is_dir():
              manifest_path = package_dir / 'manifest.json'
              manifest = json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
              package = manifest.get('package', 'nnrp-ffi')
              platform_name = package_dir.name
              scope = manifest.get('transport_scope')
              if scope not in {'tcp', 'quic', 'ipc', 'websocket'}:
                  raise SystemExit(f'{manifest_path}: invalid transport_scope {scope!r}')
              if platform_name.startswith(f'{scope}-'):
                platform_name = platform_name[len(scope) + 1:]
              zip_dir(package_dir, release_dir / f'{package}-native-{platform_name}-{version}.zip')

          for wasm_dir in sorted((dist_dir / 'wasm').glob('*')):
            if wasm_dir.is_dir():
              manifest_path = wasm_dir / 'manifest.json'
              manifest = json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
              artifact = manifest.get('artifact', manifest.get('package', wasm_dir.name))
              zip_dir(wasm_dir, release_dir / f'{artifact}-{version}.zip')

          PY

      - name: Create and verify release BOM
        shell: bash
        run: |
          set -euo pipefail
          release_dir="artifacts/release-assets"
          python scripts/release_identity.py create-bom \
            --artifacts-dir "$release_dir" \
            --output "$release_dir/release-bom.json" \
            --version "${{ needs.prepare.outputs.package_version }}" \
            --tag "${{ needs.prepare.outputs.tag_name }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --conformance-source-commit "${{ env.NNRP_CONFORMANCE_SOURCE_COMMIT }}" \
            --doc-source-commit "${{ env.NNRP_DOC_SOURCE_COMMIT }}"
          python scripts/release_identity.py verify-bom \
            --bom "$release_dir/release-bom.json" \
            --artifacts-dir "$release_dir"
          python - <<'PY'
          import hashlib
          import pathlib

          release_dir = pathlib.Path('artifacts/release-assets')
          checksums = []
          for artifact in sorted(release_dir.glob('*')):
              if artifact.is_file() and artifact.name != 'SHA256SUMS':
                  digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
                  checksums.append(f'{digest}  {artifact.name}')
          (release_dir / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nnrp-rs-release-${{ needs.prepare.outputs.package_version }}
          path: artifacts/release-assets/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: nnrp-rs v${{ needs.prepare.outputs.package_version }}
          prerelease: ${{ contains(needs.prepare.outputs.package_version, '-') }}
          files: artifacts/release-assets/*

      - name: Publish crates to crates.io
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.publish_to_crates)) && env.CARGO_REGISTRY_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.package_version }}"
          python scripts/release_identity.py verify-tag \
            --tag "${{ needs.prepare.outputs.tag_name }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}"

          crate_version_exists() {
            local crate="$1"
            python - "$crate" "$version" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          crate = sys.argv[1]
          version = sys.argv[2]
          url = f"https://crates.io/api/v1/crates/{crate}/{version}"

          try:
            with urllib.request.urlopen(url, timeout=30) as response:
              sys.exit(0 if response.status == 200 else 1)
          except urllib.error.HTTPError as error:
            if error.code == 404:
              sys.exit(1)
            raise
          PY
          }

          sleep_until_retry_after() {
            local output="$1"
            local retry_after
            retry_after="$(python - "$output" <<'PY'
          import email.utils
          import re
          import sys
          import time

          output = sys.argv[1]
          match = re.search(r"try again after (.+? GMT)", output)
          if not match:
            print("")
            sys.exit(0)

          target = email.utils.parsedate_to_datetime(match.group(1)).timestamp()
          wait = max(15, int(target - time.time()) + 10)
          print(wait)
          PY
          )"

            if [ -n "$retry_after" ]; then
              echo "crates.io rate limit requested waiting ${retry_after}s before retrying."
              sleep "$retry_after"
              return 0
            fi

            return 1
          }

          if ! publish_order="$(python scripts/resolve_crate_publish_order.py)"; then
            echo "Failed to resolve crates.io publish order."
            exit 1
          fi
          mapfile -t crates <<< "$publish_order"
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "Resolved crates.io publish order is empty."
            exit 1
          fi
          printf 'Resolved crates.io publish order: %s\n' "${crates[*]}"

          for crate in "${crates[@]}"; do
            published=0
            if crate_version_exists "$crate"; then
              echo "$crate $version is already published; skipping."
              continue
            fi

            for attempt in 1 2 3 4 5; do
              echo "Publishing $crate $version (attempt $attempt)."
              output_file="$(mktemp)"
              if cargo publish -p "$crate" 2>&1 | tee "$output_file"; then
                published=1
                break
              fi

              output="$(cat "$output_file")"
              rm -f "$output_file"

              if crate_version_exists "$crate"; then
                echo "$crate $version is visible on crates.io after publish retry; continuing."
                published=1
                break
              fi

              if echo "$output" | grep -q "429 Too Many Requests"; then
                sleep_until_retry_after "$output" || sleep 60
              elif [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 20))
              fi
            done

            if [ "$published" -ne 1 ]; then
              exit 1
            fi
          done
